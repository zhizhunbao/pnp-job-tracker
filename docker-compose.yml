# pnp-job-tracker 运行时全栈(单一 compose,项目名 pnp → 容器统一 pnp-* 前缀)。
# 2026-08-31 批N Frank 拍板「一域一容器 + docker/ 目录退役」:本文件自 docker/ 迁仓库根,
# Dockerfile 归域(通用轻镜像 etl/sched/Dockerfile —— 2026-08-31 Frank 拍板随调度门走;浏览器重镜像 etl/crawl/Dockerfile),
# 原挂 pnp/ee 角色合租的七域(ats/lmia/aip/citations/dli/fcip/rcip)拆成各自 service。
# 2026-08-31 Frank 拍板:本地闲置的 postgres/cms 两 service 删除(07-16 割接 Render 后,
# dev 直连生产库、seed 直打 offer2pr.com,这套本地件零流量还顶着陈 schema 报错)——
# 全栈 = 15 个 ETL 容器,一域一容器,SOURCE=域名,节奏真相在各域 META。
#
# 用法(仓库根执行):
#   无人值守全栈:docker compose up -d --build
#   日志 docker compose logs -f  |  停 docker compose down
# 开机自启:Docker Desktop 勾「登录时启动」+ 各容器 restart:unless-stopped。
name: pnp

x-etl: &etl                        # 通用数据层镜像(httpx 类源 + build/backup 共用;YAML 锚点)
  build:
    context: .                     # 仓库根(compose 与它同级)
    dockerfile: etl/sched/Dockerfile
  restart: unless-stopped
  working_dir: /repo               # etl/paths 以此为根解析 data/
  volumes:
    - .:/repo                      # 源码 + data/ 落盘到宿主
  extra_hosts:
    - 'host.docker.internal:host-gateway'

services:
  jobbank:                         # 抓 Job Bank(只刷 raw/jobbank/)
    <<: *etl
    environment:
      SOURCE: jobbank
      HEALTHCHECK_PING_JOBBANK: ${HEALTHCHECK_PING_JOBBANK:-}
      # SCRAPE_INTERVAL 2026-08-31 批F 退役:节奏真相=域 META(jobbank 域 3600;2026-07-16 拍板文字随迁)
      SINCE_DAYS: '3'
      TZ: EST5EDT                  # 日志用东部时区(glibc 原生,无需 tzdata);postgres 保持 UTC

  howto:                           # 投递方式(2026-09-23 站内投递批 1;jobbank 域第二役):板上 Job Bank 直发帖逐帖取「How to apply」→ 邮箱 / 投递渠道 / 截止日 / 下架;只刷 processed/jobbank/howto.json 与 crawl/jobbank-howto/,灌库归 build 链;设计稿 docs/design/站内投递批1-投递邮箱入库-20260923.md
    <<: *etl
    environment:
      SOURCE: howto
      HEALTHCHECK_PING_HOWTO: ${HEALTHCHECK_PING_HOWTO:-}   # 未配 = ping_health 自然跳过
      HOWTO_MAX: ${HOWTO_MAX:-3000}               # 每轮查多少帖(1 秒一帖约 50 分钟;首轮补抓约 10 轮追平)
      HOWTO_SLEEP: ${HOWTO_SLEEP:-1.0}            # 每帖间隔秒数:比详情抓取慢四倍 —— Job Bank 求职者条款 2026-08-07 版禁自动化访问,动静压低
      TZ: EST5EDT

  pnp:                             # 省提名事实构建 + watch/freshness 两哨兵(只刷 raw;build 角色消费灌库)
    <<: *etl
    environment:
      SOURCE: pnp
      HEALTHCHECK_PING_PNP: ${HEALTHCHECK_PING_PNP:-}
      # SCRAPE_INTERVAL 2026-08-31 批F 退役:节奏真相=pnp 域 META(3600;#128 拍板文字随迁,批2 周更回归已修)
      # 2026-08-31 批N「一域一容器」:原合租本角色的 aip/citations/dli/fcip/rcip 各自成 service,
      # 本容器只剩 pnp 域;freshness 哨兵盯的是产物文件,跨容器仍有效(批O 随 manifest 退役重排)
      TZ: EST5EDT

  aip:                             # AIP 大西洋试点:指定雇主名单 + 规则(原挂 pnp 角色,批N 拆出)
    <<: *etl
    environment:
      SOURCE: aip
      TZ: EST5EDT

  eligibility:                     # 联邦试点申请人门槛库(AIP/RCIP/FCIP quote-anchored;2026-09-06 立域,aip 域规则步搬入;域名由 rules 改)
    <<: *etl
    environment:
      SOURCE: eligibility
      TZ: EST5EDT

  citations:                       # 官方引用着陆页核验(field-sources 32 行;原挂 pnp 角色,批N 拆出)
    <<: *etl
    environment:
      SOURCE: citations
      TZ: EST5EDT

  dli:                             # DLI 指定院校 + PGWP 资格表(原挂 pnp 角色,批N 拆出)
    <<: *etl
    environment:
      SOURCE: dli
      TZ: EST5EDT

  fcip:                            # FCIP 法语社区试点三件(社区/职业/配额;原挂 pnp 角色,批N 拆出)
    <<: *etl
    environment:
      SOURCE: fcip
      TZ: EST5EDT

  rcip:                            # RCIP 乡村社区试点三件(雇主/职业/配额;原挂 pnp 角色,批N 拆出)
    <<: *etl
    environment:
      SOURCE: rcip
      TZ: EST5EDT

  lmia:                            # ESDC 正面 LMIA 雇主季表(原挂 ee 角色,批N 拆出)
    <<: *etl
    environment:
      SOURCE: lmia
      TZ: EST5EDT

  ats:                             # Kanata 第一方 ATS 抓岗(2026-08-31 批N 启用 —— 此前 META 就位、服务注释态休眠)
    <<: *etl
    environment:
      SOURCE: ats
      SINCE_DAYS: '3'
      TZ: EST5EDT

  jobillico:                       # Jobillico 全国板抓岗(2026-09-06 立域,Frank「两站都接」;站点地图 → 详情 ld+json → processed/jobillico/)
    <<: *etl
    environment:
      SOURCE: jobillico
      DETAILS_PER_RUN: '3000'      # 每轮详情页上限(首轮 3.5 万张分十几轮跑完;域 __init__ 同名默认值)
      TZ: EST5EDT

  jobboom:                         # Jobboom 雇主直发岗(2026-09-06 立域;站点地图剔 /job-bank/ 转载 86% → 详情 ld+json → processed/jobboom/)
    <<: *etl
    environment:
      SOURCE: jobboom
      DETAILS_PER_RUN: '3000'
      TZ: EST5EDT

  careerbeacon:                    # CareerBeacon 大西洋四省板(2026-09-11 立域;NS/NB/NL/PE 列表页分页 → 详情 ld+json → processed/careerbeacon/)
    <<: *etl
    environment:
      SOURCE: careerbeacon
      DETAILS_PER_RUN: '3000'      # 每轮详情页上限(首轮约 1.2 万张分四五轮跑完;域 __init__ 同名默认值)
      TZ: EST5EDT

  gcjobs:                          # GC Jobs 联邦公务员招聘站(2026-09-13 立域;会话式两拉:搜索分页 → 岗位页 → processed/gcjobs/)
    <<: *etl
    environment:
      SOURCE: gcjobs
      DETAILS_PER_RUN: '1000'      # 每轮岗位页上限(公开搜索约 400 帖,首轮一次抓完;域 __init__ 同名默认值)
      TZ: EST5EDT

  crawl:                           # 九省官方站 URL 探索 + 站点地图 diff(政策雷达;只产 data/crawl/,不灌库)
    <<: *etl
    build:                         # 用带 Playwright 的重镜像(非 httpx 轻镜像):PE 在 Radware 后面,
      context: .                   # bfs_crawler 的浏览器兜底(403/验证壳→chromium)只有这个镜像跑得动
      dockerfile: etl/crawl/Dockerfile
    environment:
      SOURCE: crawl
      HEALTHCHECK_PING_CRAWL: ${HEALTHCHECK_PING_CRAWL:-}
      # SCRAPE_INTERVAL 2026-08-31 批F 退役:节奏真相=crawl 域 META(3600;08-03 拍板与负载注记随迁)
      BROWSER_HEADLESS: '1'
      TZ: EST5EDT

  ee:                              # 联邦 EE 类别+抽选(2026-07 改 httpx:类别页无 Akamai、行全量;月更,只刷 raw)
    <<: *etl
    environment:
      SOURCE: ee
      HEALTHCHECK_PING_EE: ${HEALTHCHECK_PING_EE:-}
      # SCRAPE_INTERVAL 2026-08-31 批F 退役:节奏真相=ee 域 META(3600;#128 文字随迁,批2 月更回归已修)
      TZ: EST5EDT
    # 回退:源站重新上 Akamai 时恢复 crawl 重镜像(build dockerfile: docker/etl/crawl/Dockerfile + BROWSER_HEADLESS=1)

  news:                            # 官方移民新闻聚合(E12-06;只刷 raw/news/,build 角色消费灌库)
    <<: *etl
    environment:
      SOURCE: news
      HEALTHCHECK_PING_NEWS: ${HEALTHCHECK_PING_NEWS:-}
      # SCRAPE_INTERVAL 2026-08-31 批F 退役:节奏真相=news 域 META(3600;#128 文字随迁,批2 12h 回归已修)
      # 翻译策略(Frank 2026-07-18 终版):ETL 预翻停用(budget 0)——翻译走线上实时(朋友 /api/translate,懒翻+DB缓存);
      # 恢复批量=把 NEWS_TRANSLATE_BUDGET 调回 >0(本地 NEWS_LLM_BASE / Anthropic 双后端仍在)
      NEWS_TRANSLATE_BUDGET: ${NEWS_TRANSLATE_BUDGET:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEWS_LLM_BASE: ${NEWS_LLM_BASE:-}
      NEWS_LLM_MODEL: ${NEWS_LLM_MODEL:-qwen3.6:latest}
      TZ: EST5EDT

  # enrich 批量爬虫 2026-07-20 退役(#110 Frank「不要提前跑,公司详情全懒」),2026-09-05 亮回
  # (Frank「不花钱就跑呗」「最好能定时跑」):跑的不是全量预抓,是把脉页雇主段两栏的母集
  # (在招且 有 LMIA 或 在招 TEER 0-3),四步 places(Google 免费额内)/ sites(JD 线索 → Wikidata 官网属性
  # 每轮 300 → 搜索兜底;Google Custom Search 对新项目已关,实际退 DDG)/ about(官网正文进 crawl 层;前 100 名
  # 403/JS 壳走浏览器兜底)/
  # brief(局域网 qwen 五节简介);节奏在 company 域 META(6h)。
  # 2026-09-08 换 crawl 重镜像(Playwright + Xvfb 有头):about 步兜底要浏览器;持久 profile 与 crawl
  # 容器同一份 bind-mount(chromium 单例锁:两容器撞上时后起的那个 launch 失败、本轮只走 httpx,不双开)。
  company:                         # 把脉页雇主数据链(role=enrich;company 域 SCHEDULED 四步)
    <<: *etl
    build:
      context: .
      dockerfile: etl/crawl/Dockerfile
    environment:
      SOURCE: enrich
      HEALTHCHECK_PING_ENRICH: ${HEALTHCHECK_PING_ENRICH:-}
      GOOGLE_PLACES_KEY: ${GOOGLE_PLACES_KEY:-}   # 根 .env;空=places 步跳过
      GOOGLE_CSE_KEY: ${GOOGLE_CSE_KEY:-}         # 根 .env;Programmable Search JSON API 密钥,空=复用 GOOGLE_PLACES_KEY;CX 缺=sites 步退 DDG
      GOOGLE_CSE_CX: ${GOOGLE_CSE_CX:-}           # 根 .env;Programmable Search 引擎 ID
      NEWS_LLM_BASE: ${NEWS_LLM_BASE:-}           # 局域网 Ollama(与 news 同一台盒子同一个变量);空=brief 步跳过
      NEWS_LLM_MODEL: ${NEWS_LLM_MODEL:-qwen3.6:latest}
      TZ: EST5EDT

  findsite:                        # 点开优先的查找官网(2026-09-20;company 域第二役):被真人点开过、没官网 / 官网已死 / 官网名字对不上的公司,帖内线索 → Wikidata → Bing → DDG(有头浏览器);Google 那一档只在本机跑(python etl/company/main.py --only findsite,FINDSITE_GOOGLE=1),本机开着时本容器让活
    <<: *etl
    build:
      context: .
      dockerfile: etl/crawl/Dockerfile
    environment:
      SOURCE: findsite
      BROWSER_COOKIES: findsite-cookies.json      # 自己一只空 cookie 罐 = 自己一个干净的有头浏览器(持久 profile 同一时刻只许一个进程开)
      BROWSER_UNATTENDED: "1"                     # 2026-09-22 无人值守:验证页只等 10 秒,过不去的搜总部落地页记进待放行清单,Frank 本机放行台(company --only unblock)统一过
      NEWS_LLM_BASE: ${NEWS_LLM_BASE:-}           # 局域网 Ollama(搜总部步从落地页抽街址;空=搜总部步跳过,2026-09-22 OPS 实撞:没配整步静默跳)
      HEALTHCHECK_PING_FINDSITE: ${HEALTHCHECK_PING_FINDSITE:-}   # 未配 = ping_health 自然跳过
      SEED_URL: ${SEED_URL:-https://offer2pr.com/api/seed}       # 只用它反推站点根(取活 / 交活的接口在同一个站)
      SEED_TOKEN: ${SEED_TOKEN:-}                 # 取活 / 交活的钥匙(与上传 mart 同一把);空=本役跳过
      TZ: EST5EDT

  # Algonquin HireAC 校内岗位板(2026-09-15 进容器,Frank「docker 本身不是能装浏览器吗 有头的 把凭证复制进去不就行了么」):
  # 登录墙是学院微软单点登录;共享 profile 里的 cookie 是 Windows Chrome 加密的,容器解不开 —— Frank 本机 Chrome 登录后
  # 跑 `BROWSER_CHANNEL=chrome python etl/hireac/main.py --only export` 导出明文 cookie 到 etl/crawl/.browser-profile/(gitignore),
  # 本容器加载它起有头 chromium 抓;每轮登录成功后写回续期。登录过期 = 停轮不发心跳 → healthchecks 邮件提醒 Frank 重登重导。
  hireac:                          # 校内岗位板抓取(列表翻页 + 详情回放 → raw / processed;build 角色汇装灌库)
    <<: *etl
    build:
      context: .
      dockerfile: etl/crawl/Dockerfile
    environment:
      SOURCE: hireac
      BROWSER_COOKIES: hireac-cookies.json            # = hireac 域 COOKIES_FILE;空串会退回持久 profile(容器里解不开,别留空)
      HEALTHCHECK_PING_HIREAC: ${HEALTHCHECK_PING_HIREAC:-}   # 根 .env;空 = 不发心跳(登录过期就没有邮件提醒)
      TZ: EST5EDT

  pte:                             # ynwac 机经研究:抓公开 bundle → 解析 → diff 新题雷达(周更;只产 data/pte/,不灌库)
    <<: *etl
    environment:
      SOURCE: pte
      YNWAC_TOKEN: ${YNWAC_TOKEN:-}   # 考过投票+评论用(登录门控);根 .env 注入 auth_token,空=跳过votes步;JWT 过期换新
      TZ: EST5EDT

  hwcr:                            # 海外超人渥太华站房屋帖 → Lisgar 附近出租单间清单(私用;小时更;只产 data/raw|processed/hwcr/,不灌库)
    <<: *etl
    environment:
      SOURCE: hwcr
      TZ: EST5EDT

  ircc:                            # IRCC 开放数据月更(E12-07 #116 难度指数:学签/工签存量+PNP 登陆;配额=人工维护表不在此)
    <<: *etl
    environment:
      SOURCE: ircc
      # SCRAPE_INTERVAL 2026-08-31 批F 退役:节奏真相=ircc 域 META(86400;#128 文字随迁)
      TZ: EST5EDT

  statcan:                         # StatCan WDS 日更:人口 / 临时居民 / GDP / 失业率(2026-09-06 自 ircc 搬出两段 + 新增四表)
    <<: *etl
    environment:
      SOURCE: statcan
      TZ: EST5EDT

  minwage:                         # ESDC 最低工资数据库日更:各省法定最低工资现行档 + 1965 起历次调整(2026-09-13 立域)
    <<: *etl
    environment:
      SOURCE: minwage
      TZ: EST5EDT

  explore:                         # 雇主探索队列的后台工人(2026-09-18 立域;取活 → 局域网 qwen 翻雇主名 → 交活,不产 data/ 文件)
    <<: *etl
    environment:
      SOURCE: explore
      HEALTHCHECK_PING_EXPLORE: ${HEALTHCHECK_PING_EXPLORE:-}   # 未配 = ping_health 自然跳过
      NEWS_LLM_BASE: ${NEWS_LLM_BASE:-}           # 局域网 Ollama(与 jdformat / classify / company 同一台盒子);空=本域跳过
      NEWS_LLM_MODEL: ${NEWS_LLM_MODEL:-qwen3.6:latest}
      SEED_URL: ${SEED_URL:-https://offer2pr.com/api/seed}       # 只用它反推站点根(取活 / 交活的接口在同一个站)
      SEED_TOKEN: ${SEED_TOKEN:-}                 # 取活 / 交活的钥匙(与上传 mart 同一把);空=本域跳过
      EXPLORE_LIMIT: ${EXPLORE_LIMIT:-100}        # 每轮上限(一个名字 2~3 秒,100 条约 5 分钟)
      TZ: EST5EDT

  sites:                           # 公司官网定期抓取(2026-09-19 立域;有官网且在招的公司每家抓首页 + Contact + About 进 crawl 层,局域网 qwen 只凭页面文字整理七节、每节附页面原句核对;只刷 crawl/ 与 processed/sites/)
    <<: *etl
    build:                         # 2026-09-20 起抓页一律走 crawl 域有头浏览器(Frank「crawl 不是用有头的吗」「httpx curl 都删了」):用带 Playwright + Xvfb 的重镜像
      context: .
      dockerfile: etl/crawl/Dockerfile
    environment:
      SOURCE: sites
      BROWSER_COOKIES: sites-cookies.json         # cookie 模式 = 干净的有头浏览器、不开持久 profile(那份 profile 同一时刻只许一个进程开,company / crawl 在用;公司官网不要登录态);文件不在 fetch 步自己建一只空罐
      HEALTHCHECK_PING_SITES: ${HEALTHCHECK_PING_SITES:-}       # 未配 = ping_health 自然跳过
      NEWS_LLM_BASE: ${NEWS_LLM_BASE:-}           # 局域网 Ollama(与 jdformat / explore / classify / company 同一台盒子);空=facts 步跳过
      NEWS_LLM_MODEL: ${NEWS_LLM_MODEL:-qwen3.6:latest}
      SITES_FETCH_LIMIT: ${SITES_FETCH_LIMIT:-200}  # 每轮抓多少家官网(一家 3 页走有头浏览器,实测约 40 秒一家:200 家 ≈ 两小时多,一轮接一轮连着跑)
      SITES_FACTS_LIMIT: ${SITES_FACTS_LIMIT:-200}  # 每轮整理多少家(盒子一家 4~11 秒)
      TZ: EST5EDT

  visit:                           # 点开优先(2026-09-20;sites 域第二役):被真人点开过的公司插队抓官网 → 整理总部 / 简介 → 交活直接上页面,每步把进度写回队列表(公司卡 15 秒来问一次);设计稿 docs/design/点开优先抓取与纠错-20260920.md
    <<: *etl
    build:
      context: .
      dockerfile: etl/crawl/Dockerfile
    environment:
      SOURCE: visit
      BROWSER_COOKIES: visit-cookies.json         # 自己一只空 cookie 罐 = 自己一个干净的有头浏览器,不和 sites 例行轮抢同一个标签页
      HEALTHCHECK_PING_VISIT: ${HEALTHCHECK_PING_VISIT:-}   # 未配 = ping_health 自然跳过
      NEWS_LLM_BASE: ${NEWS_LLM_BASE:-}           # 局域网 Ollama;空=只抓不整理(进度停在「整理内容」)
      NEWS_LLM_MODEL: ${NEWS_LLM_MODEL:-qwen3.6:latest}
      SEED_URL: ${SEED_URL:-https://offer2pr.com/api/seed}       # 只用它反推站点根(取活 / 交活的接口在同一个站)
      SEED_TOKEN: ${SEED_TOKEN:-}                 # 取活 / 交活的钥匙(与上传 mart 同一把);空=本役跳过
      TZ: EST5EDT

  jdformat:                        # 岗位正文 → 五节整理版预生成(2026-09-15 立域;局域网 qwen,只刷 processed/jdformat/,build 角色汇装灌库)
    <<: *etl
    environment:
      SOURCE: jdformat
      HEALTHCHECK_PING_JDFORMAT: ${HEALTHCHECK_PING_JDFORMAT:-}
      NEWS_LLM_BASE: ${NEWS_LLM_BASE:-}           # 局域网 Ollama(与 news / company 同一台盒子同一个变量);空=format 步跳过
      NEWS_LLM_MODEL: ${NEWS_LLM_MODEL:-qwen3.6:latest}
      JDFORMAT_LIMIT: ${JDFORMAT_LIMIT:-400}      # 每轮上限(盒子约 11 秒一条,400 ≈ 一个 interval)
      TZ: EST5EDT

  classify:                        # 未分类岗 → bge-m3 候选检索 + qwen 选码(2026-09-15 立域;只刷 processed/classify/,build 角色汇装灌库)
    <<: *etl
    environment:
      SOURCE: classify
      HEALTHCHECK_PING_CLASSIFY: ${HEALTHCHECK_PING_CLASSIFY:-}   # 未配 = ping_health 自然跳过
      NEWS_LLM_BASE: ${NEWS_LLM_BASE:-}           # 局域网 Ollama(与 jdformat / company 同一台盒子同一个变量);空=本域跳过
      NEWS_LLM_MODEL: ${NEWS_LLM_MODEL:-qwen3.6:latest}
      CLASSIFY_EMBED_MODEL: ${CLASSIFY_EMBED_MODEL:-bge-m3:latest}
      CLASSIFY_LIMIT: ${CLASSIFY_LIMIT:-100}      # 小配额(2026-09-16 Frank「分类也跑起来吧,小配额」):
                                                  # 与 jdformat 共用一台盒子,100 条约占一轮的一成,
                                                  # 7,500 条存量三天左右铺完,之后每天新帖一轮就能消化
      TZ: EST5EDT

  backup:                          # 每日 pg_dump 生产库 → backups/(E7-01;家里机=运维盒)
    <<: *etl
    environment:
      SOURCE: backup
      # SCRAPE_INTERVAL 2026-08-31 批F 退役:节奏真相=load 域 METAS backup 役(86400)
      BACKUP_DATABASE_URI: ${BACKUP_DATABASE_URI:-}   # docker/.env 注入 Supabase 连接串;空=跳过
      HEALTHCHECK_PING_BACKUP: ${HEALTHCHECK_PING_BACKUP:-}
      TZ: EST5EDT

  build:                           # 跨源清洗→评分→mart→seed(灌库唯一角色)
    <<: *etl
    environment:
      SOURCE: build
      HEALTHCHECK_PING_BUILD: ${HEALTHCHECK_PING_BUILD:-}
      HEALTHCHECK_PING_FRESHNESS: ${HEALTHCHECK_PING_FRESHNESS:-}   # 2026-09-15 方案 3:全舰队保鲜闸通过才 ping 这个检查项;只配给 build(每小时一轮)
      # SCRAPE_INTERVAL 2026-08-31 批F 退役:节奏真相=load 域 METAS build 役(3600 兜底 + after=jobbank;#128 文字随迁)
      SEED_URL: ${SEED_URL:-https://offer2pr.com/api/seed}  # 灌库端点由根 .env 提供(现值即生产);2026-08-31 本地 cms 容器删除后 :3001 默认档随之退役
      SEED_TOKEN: ${SEED_TOKEN:-}  # 云端 seed 鉴权(根 .env 注入);upload_mart 推 /api/mart 同用这对(E7-04,Supabase Storage 已退役)
      TZ: EST5EDT                  # 日志东部时区

