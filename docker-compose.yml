# pnp-job-tracker 运行时全栈(单一 compose,项目名 pnp → 容器统一 pnp-* 前缀)。
# 2026-08-31 批N Frank 拍板「一域一容器 + docker/ 目录退役」:本文件自 docker/ 迁仓库根,
# Dockerfile 归域(通用轻镜像 etl/sched/Dockerfile —— 2026-08-31 Frank 拍板随调度门走;浏览器重镜像 etl/crawl/Dockerfile),
# 原挂 pnp/ee 角色合租的七域(ats/lmia/aip/citations/dli/fcip/rcip)拆成各自 service。
# 2026-08-31 Frank 拍板:本地闲置的 postgres/cms 两 service 删除(07-16 割接 Render 后,
# dev 直连生产库、seed 直打 offer2pr.com,这套本地件零流量还顶着陈 schema 报错)——
# 全栈 = 15 个 ETL 容器,一域一容器,SOURCE=域名,节奏真相在各域 META。
# 2026-09-26 晚改为「一单元一容器」(Frank「我他妈之前让你拆成多个 docker 你非的合一起」「其中一个失败,其余照跑?
# 那我怎么知道这个失败」→ 拍「拆 + 每个单元配 ping」「一单元一容器」「抽选按省拆」「资格表拆三个」):
# 一个 service = 一个调度单元(SOURCE = 单元名,声明在各域 __init__ 的 META / METAS)= 一个 healthchecks 检查项
# (HEALTHCHECK_PING_<单元名大写>,根 .env 配值;没配 = 不发)。单元内一步失败即中止,哪个单元坏了哪个检查项红。
# pnp 拆 20 个、company 例行链拆 3 个、eligibility 拆 3 个,crawl / ee / ircc / statcan 各拆 2 个,qs 自 dli 容器搬出。
# ⚠ 整栈 up -d 会把停着的 hireac 拉起来(2026-09-26 Frank「HireAC 先不弄了」):起停一律点名 service。
# 同晚服务名加类别前缀(Frank 问「这个下面不需要分个类别吗」→ 选「不拆,只按名字排」:Docker Desktop 只按项目分组,
# 不拆项目,Docker Desktop 点「名称」列排序后同类挨在一起)。服务名 = <类别>_<单元名>,单元名(SOURCE、检查项键)不变:
#   job_ 职位(抓岗 / 分类 / 正文整理 / 收录) co_ 公司 pnp_ 省提名 fed_ 联邦与统计 ops_ 平台(汇装灌库 / 备份 / 官方站 / 检查项) my_ 私用
#
# 用法(仓库根执行):
#   无人值守全栈:docker compose up -d --build
#   日志 docker compose logs -f  |  停 docker compose down
# 开机自启:Docker Desktop 勾「登录时启动」+ 各容器 restart:unless-stopped。
name: pnp

x-etl: &etl                        # 通用数据层镜像(httpx 类源 + build/backup 共用;YAML 锚点)
  build:
    context: .                     # 仓库根(compose 与它同级)
    dockerfile: etl/sched/Dockerfile
  restart: unless-stopped
  working_dir: /repo               # etl/paths 以此为根解析 data/
  volumes:
    - .:/repo                      # 源码 + data/ 落盘到宿主
  extra_hosts:
    - 'host.docker.internal:host-gateway'

x-hc: &hc                         # 2026-09-26 晚(Frank「拆 + 每个单元配 ping」):每个容器都带 healthchecks API 密钥 ——
                                  # 没配 HEALTHCHECK_PING_<单元名> 的单元开跑即按单元名自建 / 取自己的检查项(sched ping_url_of);
                                  # 密钥在根 .env,Frank 亲手放;空 = 照旧只认 HEALTHCHECK_PING_<单元名>
  HEALTHCHECKS_API_KEY: ${HEALTHCHECKS_API_KEY:-}
  HEALTHCHECKS_API_URL: ${HEALTHCHECKS_API_URL:-http://healthchecks:8000}   # 同日 Frank 选「本机自建(免费)」:缺省指本 compose 的 healthchecks 服务;
                                  # 托管版免费档只有 20 个检查项,全舰队约 63 个;托管版原有 6 个照旧走 .env 里 HEALTHCHECK_PING_<单元名> 的地址

services:
  job_jobbank:                         # 抓 Job Bank(只刷 raw/jobbank/)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: jobbank
      HEALTHCHECK_PING_JOBBANK: ${HEALTHCHECK_PING_JOBBANK:-}
      # SCRAPE_INTERVAL 2026-08-31 批F 退役:节奏真相=域 META(jobbank 域 3600;2026-07-16 拍板文字随迁)
      SINCE_DAYS: '3'
      TZ: EST5EDT                  # 日志用东部时区(glibc 原生,无需 tzdata);postgres 保持 UTC

  job_howto:                           # 投递方式(2026-09-23 站内投递批 1;jobbank 域第二役):板上 Job Bank 直发帖逐帖取「How to apply」→ 邮箱 / 投递渠道 / 截止日 / 下架;只刷 processed/jobbank/howto.json 与 crawl/jobbank-howto/,灌库归 build 链;设计稿 docs/design/站内投递批1-投递邮箱入库-20260923.md
    <<: *etl
    environment:
      <<: *hc
      SOURCE: howto
      HEALTHCHECK_PING_HOWTO: ${HEALTHCHECK_PING_HOWTO:-}   # 未配 = ping_health 自然跳过
      HOWTO_MAX: ${HOWTO_MAX:-3000}               # 每轮查多少帖(1 秒一帖约 50 分钟;首轮补抓约 10 轮追平)
      HOWTO_SLEEP: ${HOWTO_SLEEP:-1.0}            # 每帖间隔秒数:比详情抓取慢四倍 —— Job Bank 求职者条款 2026-08-07 版禁自动化访问,动静压低
      TZ: EST5EDT

  # pnp 域 2026-09-26 晚拆成 20 个单元(Frank「我他妈之前让你拆成多个 docker 你非的合一起」「其中一个失败,其余照跑?
  # 那我怎么知道这个失败」→ 拍「拆 + 每个单元配 ping」「一单元一容器」「抽选按省拆」):原先一个 pnp 容器跑 38 步、只有一个 ping,
  # 改为一单元一容器一 ping(HEALTHCHECK_PING_<单元名大写>),单元内一步失败即中止;单元清单与切法见 etl/pnp/main.py 的 UNITS。
  # 原 pnp service 逐字留档:
  #   pnp:  # 省提名事实构建 + watch/freshness 两哨兵(只刷 raw;build 角色消费灌库)
  #     SOURCE: pnp
  #     HEALTHCHECK_PING_PNP: ${HEALTHCHECK_PING_PNP:-}     ← 整个 pnp 一个检查项,随拆退役
  #     # SCRAPE_INTERVAL 2026-08-31 批F 退役:节奏真相=pnp 域 META(3600;#128 拍板文字随迁,批2 周更回归已修)
  #     # 2026-08-31 批N「一域一容器」:原合租本角色的 aip/citations/dli/fcip/rcip 各自成 service,
  #     # 本容器只剩 pnp 域;freshness 哨兵盯的是产物文件,跨容器仍有效(批O 随 manifest 退役重排)
  pnp_ab:                          # 阿省 AAIP:排除清单 / 门槛 / 配额统计(alberta.ca)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_ab
      HEALTHCHECK_PING_PNP_AB: ${HEALTHCHECK_PING_PNP_AB:-}
      TZ: EST5EDT

  pnp_bc:                          # 卑诗 BC PNP:定向清单 / 门槛 / SIRS 分值 / 统计 / 已发提名(welcomebc.ca)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_bc
      HEALTHCHECK_PING_PNP_BC: ${HEALTHCHECK_PING_PNP_BC:-}
      TZ: EST5EDT

  pnp_sk:                          # 萨省 SINP:三通道清单 / 工作邀约排除表 / 分值 / 门槛 / 统计(saskatchewan.ca)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_sk
      HEALTHCHECK_PING_PNP_SK: ${HEALTHCHECK_PING_PNP_SK:-}
      TZ: EST5EDT

  pnp_mb:                          # 曼省 MPNP:在需职业 / 门槛 / EOI 分值 / 统计(immigratemanitoba.com)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_mb
      HEALTHCHECK_PING_PNP_MB: ${HEALTHCHECK_PING_PNP_MB:-}
      TZ: EST5EDT

  pnp_ns:                          # 新斯 NSNP:通道清单 / 门槛 / 已发提名 / 年度配额(liveinnovascotia.com + data.novascotia.ca)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_ns
      HEALTHCHECK_PING_PNP_NS: ${HEALTHCHECK_PING_PNP_NS:-}
      TZ: EST5EDT

  pnp_nb:                          # 新不 NBPNP:不受理职业 / 门槛(gnb.ca)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_nb
      HEALTHCHECK_PING_PNP_NB: ${HEALTHCHECK_PING_PNP_NB:-}
      TZ: EST5EDT

  pnp_nl:                          # 纽省 NLPNP:优先职位 / 门槛 / 分值 / 指定雇主(gov.nl.ca)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_nl
      HEALTHCHECK_PING_PNP_NL: ${HEALTHCHECK_PING_PNP_NL:-}
      TZ: EST5EDT

  pnp_pe:                          # 爱德华王子岛 PEI PNP:在需职业 / AIP 排除 / 门槛 / 配额与提名(princeedwardisland.ca PDF)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_pe
      HEALTHCHECK_PING_PNP_PE: ${HEALTHCHECK_PING_PNP_PE:-}
      TZ: EST5EDT

  pnp_on:                          # 安省 OINP:劳动力优先表守望 / 门槛 / 分值 / 运营统计(ontario.ca)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_on
      HEALTHCHECK_PING_PNP_ON: ${HEALTHCHECK_PING_PNP_ON:-}
      TZ: EST5EDT

  pnp_qc:                          # 魁省 PSTQ / PEQ 门槛 + 年度移民计划(quebec.ca;QC 不属 PNP,按省对待)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_qc
      HEALTHCHECK_PING_PNP_QC: ${HEALTHCHECK_PING_PNP_QC:-}
      TZ: EST5EDT

  pnp_draws_ab:                    # 阿省抽选(一省一份 raw/pnp/draws-ab.json;任一页失败本单元红、文件不动)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_draws_ab
      HEALTHCHECK_PING_PNP_DRAWS_AB: ${HEALTHCHECK_PING_PNP_DRAWS_AB:-}
      TZ: EST5EDT

  pnp_draws_bc:                    # 卑诗抽选(官方页 + 逐年存档 PDF)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_draws_bc
      HEALTHCHECK_PING_PNP_DRAWS_BC: ${HEALTHCHECK_PING_PNP_DRAWS_BC:-}
      TZ: EST5EDT

  pnp_draws_mb:                    # 曼省抽选(首页实抓 + 第 2~5 页读 crawl 缓存)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_draws_mb
      HEALTHCHECK_PING_PNP_DRAWS_MB: ${HEALTHCHECK_PING_PNP_DRAWS_MB:-}
      TZ: EST5EDT

  pnp_draws_nb:                    # 新不抽选(当期页 + 本年历史页)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_draws_nb
      HEALTHCHECK_PING_PNP_DRAWS_NB: ${HEALTHCHECK_PING_PNP_DRAWS_NB:-}
      TZ: EST5EDT

  pnp_draws_nl:                    # 纽省抽选
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_draws_nl
      HEALTHCHECK_PING_PNP_DRAWS_NL: ${HEALTHCHECK_PING_PNP_DRAWS_NL:-}
      TZ: EST5EDT

  pnp_draws_ns:                    # 新斯月度选取人数(只读 crawl 缓存)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_draws_ns
      HEALTHCHECK_PING_PNP_DRAWS_NS: ${HEALTHCHECK_PING_PNP_DRAWS_NS:-}
      TZ: EST5EDT

  pnp_draws_on:                    # 安省抽选(更新页通告 + invitations 页)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_draws_on
      HEALTHCHECK_PING_PNP_DRAWS_ON: ${HEALTHCHECK_PING_PNP_DRAWS_ON:-}
      TZ: EST5EDT

  pnp_draws_pe:                    # 爱德华王子岛抽选(只读 crawl 缓存:官网在 Radware 墙后)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_draws_pe
      HEALTHCHECK_PING_PNP_DRAWS_PE: ${HEALTHCHECK_PING_PNP_DRAWS_PE:-}
      TZ: EST5EDT

  pnp_draws_qc:                    # 魁省 PSTQ 邀请(只读 crawl 缓存;QC 不属 PNP,只收邀请事实)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_draws_qc
      HEALTHCHECK_PING_PNP_DRAWS_QC: ${HEALTHCHECK_PING_PNP_DRAWS_QC:-}
      TZ: EST5EDT

  pnp_drawzh:                      # 抽选流名中文灰注(局域网 Ollama;盯九个抽选单元的轮次标记,有流名没翻成即红)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_drawzh
      HEALTHCHECK_PING_PNP_DRAWZH: ${HEALTHCHECK_PING_PNP_DRAWZH:-}
      TZ: EST5EDT

  pnp_watch:                       # 名额公告哨兵(只读配额表 / crawl 缓存 / news,不发请求)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: pnp_watch
      HEALTHCHECK_PING_PNP_WATCH: ${HEALTHCHECK_PING_PNP_WATCH:-}
      TZ: EST5EDT

  pnp_pathways:                    # 全国通道对照表(2026-09-28 立域):人工核定的通道对照每小时对一遍 raw/pnp 现值,对上才写 processed/pathways/,
    <<: *etl                       # 对不上逐条报红、扣 ping;只读本地文件,不发请求;mart 直通进库。起的时候只起它 —— docker compose up -d pnp_pathways
    environment:
      <<: *hc
      SOURCE: pathways
      HEALTHCHECK_PING_PATHWAYS: ${HEALTHCHECK_PING_PATHWAYS:-}
      TZ: EST5EDT

  fed_aip:                             # AIP 大西洋试点:指定雇主名单 + 规则(原挂 pnp 角色,批N 拆出)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: aip
      HEALTHCHECK_PING_AIP: ${HEALTHCHECK_PING_AIP:-}   # 2026-09-26 晚补(每个单元一个 ping);未配 = ping_health 自然跳过
      TZ: EST5EDT

  # eligibility 2026-09-26 晚拆成三个单元(AIP / RCIP / FCIP 三张表互不相干,一表一容器一 ping;Frank 选「拆三个」)。
  # 原 service 逐字留档:
  #   eligibility:  # 联邦试点申请人门槛库(AIP/RCIP/FCIP quote-anchored;2026-09-06 立域,aip 域规则步搬入;域名由 rules 改)
  #     SOURCE: eligibility
  fed_eligibility_aip:                 # AIP 申请人门槛表(只读 crawl 缓存,零网络)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: eligibility_aip
      HEALTHCHECK_PING_ELIGIBILITY_AIP: ${HEALTHCHECK_PING_ELIGIBILITY_AIP:-}
      TZ: EST5EDT

  fed_eligibility_rcip:                # RCIP 申请人门槛表(同上)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: eligibility_rcip
      HEALTHCHECK_PING_ELIGIBILITY_RCIP: ${HEALTHCHECK_PING_ELIGIBILITY_RCIP:-}
      TZ: EST5EDT

  fed_eligibility_fcip:                # FCIP 申请人门槛表(同上)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: eligibility_fcip
      HEALTHCHECK_PING_ELIGIBILITY_FCIP: ${HEALTHCHECK_PING_ELIGIBILITY_FCIP:-}
      TZ: EST5EDT

  fed_citations:                       # 官方引用着陆页核验(field-sources 32 行;原挂 pnp 角色,批N 拆出)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: citations
      HEALTHCHECK_PING_CITATIONS: ${HEALTHCHECK_PING_CITATIONS:-}   # 2026-09-26 晚补
      TZ: EST5EDT

  fed_dli:                             # DLI 指定院校 + PGWP 资格表(原挂 pnp 角色,批N 拆出)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: dli
      HEALTHCHECK_PING_DLI: ${HEALTHCHECK_PING_DLI:-}   # 2026-09-26 晚补;qs 同日搬出本容器自成一个
      TZ: EST5EDT

  fed_qs:                              # QS 加拿大院校排名(2026-09-26 晚自 dli 容器搬出自成一个:原寄住 dli 角色,Frank「拆成多个 docker」)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: qs
      HEALTHCHECK_PING_QS: ${HEALTHCHECK_PING_QS:-}
      TZ: EST5EDT

  fed_fcip:                            # FCIP 法语社区试点三件(社区/职业/配额;原挂 pnp 角色,批N 拆出)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: fcip
      HEALTHCHECK_PING_FCIP: ${HEALTHCHECK_PING_FCIP:-}   # 2026-09-26 晚补
      TZ: EST5EDT

  fed_rcip:                            # RCIP 乡村社区试点三件(雇主/职业/配额;原挂 pnp 角色,批N 拆出)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: rcip
      HEALTHCHECK_PING_RCIP: ${HEALTHCHECK_PING_RCIP:-}   # 2026-09-26 晚补
      TZ: EST5EDT

  fed_lmia:                            # ESDC 正面 LMIA 雇主季表(原挂 ee 角色,批N 拆出)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: lmia
      HEALTHCHECK_PING_LMIA: ${HEALTHCHECK_PING_LMIA:-}   # 2026-09-26 晚补
      TZ: EST5EDT

  job_ats:                             # Kanata 第一方 ATS 抓岗(2026-08-31 批N 启用 —— 此前 META 就位、服务注释态休眠)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: ats
      HEALTHCHECK_PING_ATS: ${HEALTHCHECK_PING_ATS:-}   # 2026-09-26 晚补(每个单元一个 ping);未配 = ping_health 自然跳过
      SINCE_DAYS: '3'
      TZ: EST5EDT

  job_jobillico:                       # Jobillico 全国板抓岗(2026-09-06 立域,Frank「两站都接」;站点地图 → 详情 ld+json → processed/jobillico/)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: jobillico
      HEALTHCHECK_PING_JOBILLICO: ${HEALTHCHECK_PING_JOBILLICO:-}   # 2026-09-26 晚补(每个单元一个 ping);未配 = ping_health 自然跳过
      DETAILS_PER_RUN: '3000'      # 每轮详情页上限(首轮 3.5 万张分十几轮跑完;域 __init__ 同名默认值)
      TZ: EST5EDT

  job_jobboom:                         # Jobboom 雇主直发岗(2026-09-06 立域;站点地图剔 /job-bank/ 转载 86% → 详情 ld+json → processed/jobboom/)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: jobboom
      HEALTHCHECK_PING_JOBBOOM: ${HEALTHCHECK_PING_JOBBOOM:-}   # 2026-09-26 晚补(每个单元一个 ping);未配 = ping_health 自然跳过
      DETAILS_PER_RUN: '3000'
      TZ: EST5EDT

  job_careerbeacon:                    # CareerBeacon 大西洋四省板(2026-09-11 立域;NS/NB/NL/PE 列表页分页 → 详情 ld+json → processed/careerbeacon/)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: careerbeacon
      HEALTHCHECK_PING_CAREERBEACON: ${HEALTHCHECK_PING_CAREERBEACON:-}   # 2026-09-26 晚补(每个单元一个 ping);未配 = ping_health 自然跳过
      DETAILS_PER_RUN: '3000'      # 每轮详情页上限(首轮约 1.2 万张分四五轮跑完;域 __init__ 同名默认值)
      TZ: EST5EDT

  job_gcjobs:                          # GC Jobs 联邦公务员招聘站(2026-09-13 立域;会话式两拉:搜索分页 → 岗位页 → processed/gcjobs/)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: gcjobs
      HEALTHCHECK_PING_GCJOBS: ${HEALTHCHECK_PING_GCJOBS:-}   # 2026-09-26 晚补(每个单元一个 ping);未配 = ping_health 自然跳过
      DETAILS_PER_RUN: '1000'      # 每轮岗位页上限(公开搜索约 400 帖,首轮一次抓完;域 __init__ 同名默认值)
      TZ: EST5EDT

  ops_crawl:                           # 九省官方站 URL 探索 + 站点地图 diff(政策雷达;只产 data/crawl/,不灌库)
    <<: *etl
    build:                         # 用带 Playwright 的重镜像(非 httpx 轻镜像):PE 在 Radware 后面,
      context: .                   # bfs_crawler 的浏览器兜底(403/验证壳→chromium)只有这个镜像跑得动
      dockerfile: etl/crawl/Dockerfile
    environment:
      <<: *hc
      SOURCE: crawl
      HEALTHCHECK_PING_CRAWL: ${HEALTHCHECK_PING_CRAWL:-}
      # SCRAPE_INTERVAL 2026-08-31 批F 退役:节奏真相=crawl 域 META(3600;08-03 拍板与负载注记随迁)
