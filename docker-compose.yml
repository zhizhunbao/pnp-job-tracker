      SOURCE: indexing
      HEALTHCHECK_PING_INDEXING: ${HEALTHCHECK_PING_INDEXING:-}   # 未配 = ping_health 自然跳过
      GOOGLE_INDEXING_KEY_FILE: ${GOOGLE_INDEXING_KEY_FILE:-secrets/google-indexing.json}   # 服务账号 JSON 密钥路径(相对仓库根,/secrets/ 已 gitignore);默认这条路径 = 文件一放下下一轮自动开推,不用改 .env、不用重建容器;文件不在 = 每轮一行警告跳过
      TZ: EST5EDT

  ops_backup:                          # 每日 pg_dump 生产库 → backups/(E7-01;家里机=运维盒)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: backup
      # SCRAPE_INTERVAL 2026-08-31 批F 退役:节奏真相=load 域 METAS backup 役(86400)
      BACKUP_DATABASE_URI: ${BACKUP_DATABASE_URI:-}   # docker/.env 注入 Supabase 连接串;空=跳过
      HEALTHCHECK_PING_BACKUP: ${HEALTHCHECK_PING_BACKUP:-}
      TZ: EST5EDT

  ops_build:                           # 跨源清洗→评分→mart→seed(灌库唯一角色)
    <<: *etl
    environment:
      <<: *hc
      SOURCE: build
      HEALTHCHECK_PING_BUILD: ${HEALTHCHECK_PING_BUILD:-}
      HEALTHCHECK_PING_FRESHNESS: ${HEALTHCHECK_PING_FRESHNESS:-}   # 2026-09-15 方案 3:全舰队保鲜闸通过才 ping 这个检查项;只配给 build(每小时一轮)
      # SCRAPE_INTERVAL 2026-08-31 批F 退役:节奏真相=load 域 METAS build 役(3600 兜底 + after=jobbank;#128 文字随迁)
      SEED_URL: ${SEED_URL:-https://offer2pr.com/api/seed}  # 灌库端点由根 .env 提供(现值即生产);2026-08-31 本地 cms 容器删除后 :3001 默认档随之退役
      SEED_TOKEN: ${SEED_TOKEN:-}  # 云端 seed 鉴权(根 .env 注入);upload_mart 推 /api/mart 同用这对(E7-04,Supabase Storage 已退役)
      TZ: EST5EDT                  # 日志东部时区

  # 本机自建 healthchecks(2026-09-26 晚,Frank 选「本机自建(免费)」):托管版免费档只有 20 个检查项,拆成一单元一容器后
  # 全舰队约 63 个 —— 本机起官方开源版,检查项不限数,SQLite 存在命名卷 hcdata(删容器不丢)。页面 http://localhost:8000
  # (只绑本机);ETL 容器按服务名 http://healthchecks:8000 调 API 建检查项、打 ping(PING_ENDPOINT 因此写服务名)。
  # 托管版上原有的 6 个(jobbank / ee / build / backup / hireac / 保鲜)照旧 —— 顺带当「这台机器整个挂了」的外部报警。
  # Frank 亲手:建管理员账号(docker compose exec ops_healthchecks ./manage.py createsuperuser;同晚服务名加 ops_ 前缀,
  # 且别写 /opt/… 绝对路径 —— Git Bash 会改写;原写法 docker compose exec healthchecks /opt/healthchecks/manage.py createsuperuser)、
  # 页面里建 API 密钥放进根 .env 的 HEALTHCHECKS_API_KEY、告警邮箱的 Gmail 应用专用密码放 HC_EMAIL_USER / HC_EMAIL_PASSWORD;
  # HC_SECRET_KEY(会话签名用的随机串)由 lead 生成进根 .env。
  ops_healthchecks:
    image: healthchecks/healthchecks:v4.4   # 2026-08-31 发布的稳定版,钉版本不追 latest
    networks:
      default:
        aliases:
          - healthchecks               # ETL 容器按 http://healthchecks:8000 调 API、打 ping:服务名带下划线过不了 Django 的主机名校验,用别名
    restart: unless-stopped
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - hcdata:/data
    environment:
      DB: sqlite
      DB_NAME: /data/hc.sqlite
      DEBUG: 'False'
      SECRET_KEY: ${HC_SECRET_KEY:-}
      SITE_ROOT: http://localhost:8000
      SITE_NAME: offer2pr ETL
      PING_ENDPOINT: http://healthchecks:8000/ping/
      ALLOWED_HOSTS: localhost,127.0.0.1,healthchecks
      REGISTRATION_OPEN: 'False'
      EMAIL_HOST: ${HC_EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: '587'
      EMAIL_USE_TLS: 'True'
      EMAIL_HOST_USER: ${HC_EMAIL_USER:-}
      EMAIL_HOST_PASSWORD: ${HC_EMAIL_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${HC_EMAIL_USER:-healthchecks@localhost}
      TZ: EST5EDT

volumes:
  hcdata:                          # 本机 healthchecks 的 SQLite(检查项、ping 记录、账号)

# postgres/cms 两 service + pgdata 卷 2026-08-31 Frank 拍板删除:07-16 割接 Render 后
# 本地 dev 直连生产库、seed 直打 offer2pr.com,这套本地件零流量、schema 停摆只剩报错。
# cms/Dockerfile(standalone 镜像配方)保留 —— 它不只属于这套 compose。
