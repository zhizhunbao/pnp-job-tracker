[project]
name = "pnp-job-tracker"
version = "0.1.0"
description = "Daily-updating, immigration-scored job tracker for Canada's employer-offer PNP routes."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.24",
    "lxml>=5.0",
    "loguru>=0.7",
    "zhconv>=1.4",  # 抽选流名灰注的繁简转换(2026-08-30 批B 收口:原只活在本机 venv,依赖真相归一;镜像解冻时随统一重启补装)
    # XLSX 解析:build_lmia(ESDC 季度表)与 scrape_ircc_stats(IRCC 开放数据年末存量)都要它。
    # 2026-08-03 补进来 —— 此前只写在 docker/etl/httpx/Dockerfile 里,依赖真相分裂两处,
    # 结果 .venv 跑不了 ircc 役(本地一跑就 ModuleNotFoundError,只有容器里能跑)。
    "openpyxl>=3.1",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
# 有头浏览器兜底(YT/NU 的 Cloudflare 交互式验证框只能有头人点一次,cookie 落盘后容器复用)。
# 装:uv pip install -e .[browser] 或 .venv/Scripts/pip install playwright && playwright install chromium
# 写在这里而不是只写 Dockerfile —— openpyxl 依赖真相分裂两处的教训(见 dependencies 注)。
browser = ["playwright>=1.45"]

[tool.uv]
package = false

# =========================================================================
# Pyrefly(IDE 静态解析;2026-08-30):运行时靠 sys.path.insert(etl/) 找 _paths 与各域包,
# 静态工具不跟 sys.path —— 给它指同一个搜索根。域内引用一律包限定(company.constants),
# 裸兄弟名退役:各域都有 constants.py,裸名会让静态工具拿错家的。
# =========================================================================
[tool.pyrefly]
search-path = ["etl"]

[tool.ruff]
line-length = 120
target-version = "py311"

# =========================================================================
# etl 写法闸(2026-08-29 分域批3 立;判据与 cms 同一部宪法两种方言)
# 全局开严,存量按「一域一行」挂 ignore —— 大修哪个域就摘哪行,只紧不松
# (对标 cms 的 REFACTORED 滚动名单 + suppressions 基线)。
# 新写文件(各域 main/__init__、_steps、auto_update、未来 employers/ 等新域)不在
# ignore 名单里,天然全严 —— 「新写就范,存量滚动」。
# =========================================================================
[tool.ruff.lint]
# E4/E7/E9/F = ruff 默认族(设了 select 会覆盖默认,必须显式带上);
# ANN 签名类型注解 / D1 缺 docstring(只查「有没有」,不查排版风格)/ N 命名 /
# C90 复杂度 / PLR0915 语句数 / BLE 裸捕获 / S110+S112 吞错(try-except-pass/continue)
select = ["E4", "E7", "E9", "F", "ANN", "D1", "N", "C901", "PLR0913", "PLR0915", "BLE", "S110", "S112"]
# E402 全局豁免(2026-08-30 Frank「行内注释都去掉」):etl 全域的 bootstrap 惯例是
# sys.path.insert 先行再 import 本地件 —— 结构性成因,不值得每行挂 noqa 牌;摘牌后
# import 区零行内注释。判断型特批(BLE001/S112)仍逐行挂牌,理由住所属声明的 docstring。
ignore = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 1

[tool.ruff.lint.per-file-ignores]
# ---- 存量豁免(只豁免「严打族」,E/F 语法错误照拦;摘行=该域形制就范完成)----
# 编号主管线与根上基础设施/库(批3 前存量)
# 编号主管线 2026-08-31 批H 全数迁 mart/jobbank 两域(etl/[0-9]*.py 行退役,豁免随迁下方)
# 2026-08-30 一参令兑现(Frank:参数和返回值只允许一个):fetch 豁免清零;
# news/functions 只剩 run() 复杂度拆分债(随批C news 溶解还)。
"etl/news/functions.py" = ["C901", "PLR0915"]
# ⚠ noc/constants 只豁免 F601(重复字典键 9 处:金融/行政/法律/教育/社会服务/体育/销售/零售/运输)——
# python 语义=后键赢,前键是死行;哪个该赢是**分类口径判定**(改分类必跑 audit_noc_classes),
# 台账待 Frank 拍,拍完删此行豁免(2026-08-29 批3 盘出;2026-08-31「noc 就叫 noc」并域,
# 豁免随 I18N 表从 noc_buckets.py 搬家,其余全严格零豁免)
"etl/noc/constants.py" = ["F601"]
"etl/run_now.py" = ["ANN", "D1", "N", "C901", "PLR0913", "PLR0915", "BLE", "S110", "S112"]
"etl/auto_update.py" = ["ANN", "D1", "N", "C901", "PLR0913", "PLR0915", "BLE", "S110", "S112"]
# 横切层与旧役册(整目录存量)
"etl/clean/*.py" = ["ANN", "D1", "N", "C901", "PLR0913", "PLR0915", "BLE", "S110", "S112"]
# crawl 2026-08-30 全溶:整目录豁免退役,只剩 walk/fetch_page/discover 复杂度拆分债(批C 还)。
"etl/crawl/functions.py" = ["C901", "PLR0915"]
# 批F(2026-08-31 jobbank/ats 立域,搬家批):四个编号抓岗件迁域改名,存量债随行豁免,
# 方言全溶随后续滚动批还账(摘行=就范完成);main/__init__ 新写零豁免
"etl/jobbank/scrape_*.py" = ["ANN", "D1", "N", "C901", "PLR0913", "PLR0915", "BLE", "S110", "S112"]
# 批H(2026-08-31 移动批)迁入件存量豁免(main/__init__ 新写零豁免;批I 全溶后摘)
"etl/mart/score_mart_jobs.py" = ["ANN", "D1", "N", "C901", "PLR0913", "PLR0915", "BLE", "S110", "S112"]
"etl/mart/build_mart.py" = ["ANN", "D1", "N", "C901", "PLR0913", "PLR0915", "BLE", "S110", "S112"]
