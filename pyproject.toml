[project]
name = "pnp-job-tracker"
version = "0.1.0"
description = "Daily-updating, immigration-scored job tracker for Canada's employer-offer PNP routes."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.24",
    "lxml>=5.0",
    "loguru>=0.7",
    # XLSX 解析:build_lmia(ESDC 季度表)与 scrape_ircc_stats(IRCC 开放数据年末存量)都要它。
    # 2026-08-03 补进来 —— 此前只写在 docker/etl/httpx/Dockerfile 里,依赖真相分裂两处,
    # 结果 .venv 跑不了 ircc 役(本地一跑就 ModuleNotFoundError,只有容器里能跑)。
    "openpyxl>=3.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
