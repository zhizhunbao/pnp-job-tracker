<svg xmlns="http://www.w3.org/2000/svg" width="680" height="514" viewBox="0 0 680 514" role="img"><title>L2 决策引擎的报告契约字段流</title><desc>目标与档案快照输入,产出 report 对象;conclusions 含 verdict、confidence、evidence、gaps、next_steps;evidence 回链官方来源页与 L3 实体页。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
.t{font-size:14px;font-weight:400;fill:#2C2C2A}
.ts{font-size:12px;font-weight:400;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.dash{fill:none;stroke:#B4B2A9;stroke-width:.5;stroke-dasharray:4 4}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.c-gray>text.th{fill:#444441}.c-gray>text.ts{fill:#5F5E5A}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.c-purple>text.th{fill:#3C3489}.c-purple>text.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.c-teal>text.th{fill:#085041}.c-teal>text.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}
.c-coral>text.th{fill:#712B13}.c-coral>text.ts{fill:#993C1D}
@media (prefers-color-scheme:dark){
.t,.th{fill:#F1EFE8}.ts{fill:#B4B2A9}
.dash{stroke:#5F5E5A}.arr{stroke:#888780}
.c-gray>rect{fill:#444441;stroke:#B4B2A9}.c-gray>text.th{fill:#F1EFE8}.c-gray>text.ts{fill:#D3D1C7}
.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>text.th{fill:#CECBF6}.c-purple>text.ts{fill:#AFA9EC}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>text.th{fill:#9FE1CB}.c-teal>text.ts{fill:#5DCAA5}
.c-coral>rect{fill:#712B13;stroke:#F0997B}.c-coral>text.th{fill:#F5C4B3}.c-coral>text.ts{fill:#F0997B}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="140" y="40" width="180" height="48" rx="4"/><text class="th" x="230" y="62" text-anchor="middle">goal</text><text class="ts" x="230" y="80" text-anchor="middle">用户选的目标</text></g>
<g class="c-gray"><rect x="360" y="40" width="180" height="48" rx="4"/><text class="th" x="450" y="62" text-anchor="middle">profile_snapshot</text><text class="ts" x="450" y="80" text-anchor="middle">档案快照,可复算</text></g>
<line class="arr" x1="230" y1="88" x2="230" y2="118" marker-end="url(#arrow)"/>
<line class="arr" x1="450" y1="88" x2="450" y2="118" marker-end="url(#arrow)"/>
<rect class="dash" x="40" y="120" width="600" height="204" rx="8"/><text class="th" x="56" y="146">report</text><text class="ts" x="116" y="146">有字段的对象,不是散文</text>
<rect class="dash" x="56" y="156" width="568" height="92" rx="4"/><text class="th" x="72" y="176">conclusions[]</text>
<g class="c-coral"><rect x="72" y="184" width="100" height="52" rx="4"/><text class="th" x="122" y="206" text-anchor="middle">verdict</text><text class="ts" x="122" y="224" text-anchor="middle">一句话结论</text></g><g class="c-coral"><rect x="181" y="184" width="100" height="52" rx="4"/><text class="th" x="231" y="206" text-anchor="middle">confidence</text><text class="ts" x="231" y="224" text-anchor="middle">高中低加理由</text></g><g class="c-coral"><rect x="290" y="184" width="100" height="52" rx="4"/><text class="th" x="340" y="206" text-anchor="middle">evidence[]</text><text class="ts" x="340" y="224" text-anchor="middle">依据链</text></g><g class="c-coral"><rect x="399" y="184" width="100" height="52" rx="4"/><text class="th" x="449" y="206" text-anchor="middle">gaps[]</text><text class="ts" x="449" y="224" text-anchor="middle">缺什么差多少</text></g><g class="c-coral"><rect x="508" y="184" width="100" height="52" rx="4"/><text class="th" x="558" y="206" text-anchor="middle">next_steps</text><text class="ts" x="558" y="224" text-anchor="middle">动作与依赖</text></g>
<g class="c-coral"><rect x="56" y="264" width="568" height="44" rx="4"/><text class="th" x="340" y="285" text-anchor="middle">alternatives</text><text class="ts" x="340" y="303" text-anchor="middle">换省、换岗、换专业的对照</text></g>
<rect class="dash" x="40" y="340" width="600" height="82" rx="8"/><text class="th" x="56" y="366">evidence 每条依据</text><text class="ts" x="196" y="366">点得开、可核对</text>
<g class="c-coral"><rect x="56" y="376" width="104" height="30" rx="4"/><text class="ts" x="108" y="395" text-anchor="middle">label</text></g><g class="c-coral"><rect x="172" y="376" width="104" height="30" rx="4"/><text class="ts" x="224" y="395" text-anchor="middle">value</text></g><g class="c-coral"><rect x="288" y="376" width="104" height="30" rx="4"/><text class="ts" x="340" y="395" text-anchor="middle">source_url</text></g><g class="c-coral"><rect x="404" y="376" width="104" height="30" rx="4"/><text class="ts" x="456" y="395" text-anchor="middle">as_of</text></g><g class="c-coral"><rect x="520" y="376" width="104" height="30" rx="4"/><text class="ts" x="572" y="395" text-anchor="middle">entity_ref</text></g>
<line class="arr" x1="340" y1="406" x2="340" y2="448" marker-end="url(#arrow)"/>
<line class="arr" x1="572" y1="406" x2="572" y2="448" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="276" y="450" width="128" height="44" rx="4"/><text class="th" x="340" y="477" text-anchor="middle">官方来源页</text></g>
<g class="c-teal"><rect x="508" y="450" width="128" height="44" rx="4"/><text class="th" x="572" y="477" text-anchor="middle">L3 实体页</text></g>
</svg>
