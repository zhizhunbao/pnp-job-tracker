<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img"><title>L3 实体层的互链关系网</title><desc>地理链国家省份城市,教育链学校专业自省份分出,机会链公司职业技能自城市接续,专业回到职业;每页同一模板,任一节点可通向决策引擎。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
.t{font-size:14px;font-weight:400;fill:#2C2C2A}
.ts{font-size:12px;font-weight:400;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.dash{fill:none;stroke:#B4B2A9;stroke-width:.5;stroke-dasharray:4 4}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.c-gray>text.th{fill:#444441}.c-gray>text.ts{fill:#5F5E5A}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.c-purple>text.th{fill:#3C3489}.c-purple>text.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.c-teal>text.th{fill:#085041}.c-teal>text.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}
.c-coral>text.th{fill:#712B13}.c-coral>text.ts{fill:#993C1D}
@media (prefers-color-scheme:dark){
.t,.th{fill:#F1EFE8}.ts{fill:#B4B2A9}
.dash{stroke:#5F5E5A}.arr{stroke:#888780}
.c-gray>rect{fill:#444441;stroke:#B4B2A9}.c-gray>text.th{fill:#F1EFE8}.c-gray>text.ts{fill:#D3D1C7}
.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>text.th{fill:#CECBF6}.c-purple>text.ts{fill:#AFA9EC}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>text.th{fill:#9FE1CB}.c-teal>text.ts{fill:#5DCAA5}
.c-coral>rect{fill:#712B13;stroke:#F0997B}.c-coral>text.th{fill:#F5C4B3}.c-coral>text.ts{fill:#F0997B}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="56" y="56" width="140" height="44" rx="4"/><text class="th" x="126" y="78" text-anchor="middle">国家</text><text class="ts" x="126" y="94" text-anchor="middle">/countries/{code}</text></g><g class="c-teal"><rect x="270" y="56" width="140" height="44" rx="4"/><text class="th" x="340" y="78" text-anchor="middle">省份</text><text class="ts" x="340" y="94" text-anchor="middle">/provinces/{code}</text></g><g class="c-teal"><rect x="484" y="56" width="140" height="44" rx="4"/><text class="th" x="554" y="78" text-anchor="middle">城市</text><text class="ts" x="554" y="94" text-anchor="middle">/cities/{slug}</text></g><g class="c-purple"><rect x="163" y="170" width="140" height="44" rx="4"/><text class="th" x="233" y="192" text-anchor="middle">学校</text><text class="ts" x="233" y="208" text-anchor="middle">/schools/{dli}</text></g><g class="c-purple"><rect x="377" y="170" width="140" height="44" rx="4"/><text class="th" x="447" y="192" text-anchor="middle">专业</text><text class="ts" x="447" y="208" text-anchor="middle">/programs/{slug}</text></g><g class="c-coral"><rect x="484" y="284" width="140" height="44" rx="4"/><text class="th" x="554" y="306" text-anchor="middle">公司</text><text class="ts" x="554" y="322" text-anchor="middle">/employers/{id}</text></g><g class="c-coral"><rect x="270" y="284" width="140" height="44" rx="4"/><text class="th" x="340" y="306" text-anchor="middle">职业</text><text class="ts" x="340" y="322" text-anchor="middle">/occupations/{noc}</text></g><g class="c-coral"><rect x="56" y="284" width="140" height="44" rx="4"/><text class="th" x="126" y="306" text-anchor="middle">技能</text><text class="ts" x="126" y="322" text-anchor="middle">/skills/{slug}</text></g>
<line class="arr" x1="196" y1="78" x2="268" y2="78" marker-end="url(#arrow)"/>
<line class="arr" x1="410" y1="78" x2="482" y2="78" marker-end="url(#arrow)"/>
<line class="arr" x1="303" y1="192" x2="375" y2="192" marker-end="url(#arrow)"/>
<path class="arr" d="M340 100 L340 135 L233 135 L233 168" marker-end="url(#arrow)"/>
<line class="arr" x1="554" y1="100" x2="554" y2="282" marker-end="url(#arrow)"/>
<line class="arr" x1="484" y1="306" x2="412" y2="306" marker-end="url(#arrow)"/>
<line class="arr" x1="270" y1="306" x2="198" y2="306" marker-end="url(#arrow)"/>
<path class="arr" d="M447 214 L447 250 L340 250 L340 282" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="56" y="364" width="568" height="48" rx="4"/><text class="th" x="340" y="386" text-anchor="middle">每页同一模板:概览、统计、趋势、关联实体、AI 分析、推荐</text><text class="ts" x="340" y="404" text-anchor="middle">任一节点都能通向 L2 算一份你的结论</text></g>
<g class="c-teal"><rect x="176" y="428" width="12" height="12" rx="2"/></g><text class="ts" x="196" y="439">地理</text>
<g class="c-purple"><rect x="296" y="428" width="12" height="12" rx="2"/></g><text class="ts" x="316" y="439">教育</text>
<g class="c-coral"><rect x="416" y="428" width="12" height="12" rx="2"/></g><text class="ts" x="436" y="439">机会</text>
</svg>
