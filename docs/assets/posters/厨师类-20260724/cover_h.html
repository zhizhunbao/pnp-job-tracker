<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* 横版封面 1920×1080(抖音发文助手「横/竖双封面」建议):左钩子+数据,右实例卡 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f7f1e3; padding: 40px; }
  .frame { height: 100%; border: 6px solid #1c1917; border-radius: 26px; background: #faf6ea;
    padding: 56px 72px; display: flex; gap: 72px; align-items: center; }
  .left { flex: 1.15; }
  .brand { font-size: 30px; font-weight: 800; letter-spacing: 2px; color: #1c1917; }
  .brand .dot { color: #f59e0b; }
  .kicker { margin-top: 30px; font-size: 32px; font-weight: 600; color: #57534e; }
  h1 { margin-top: 12px; font-size: 84px; line-height: 1.35; font-weight: 900; color: #1c1917; letter-spacing: 2px; }
  .hl { background: linear-gradient(transparent 55%, #fde047 55%); padding: 0 6px; }
  .nums { margin-top: 44px; display: flex; gap: 22px; }
  .stat { flex: 1; background: #fff; border: 4px solid #1c1917; border-radius: 18px; padding: 26px 20px 22px; text-align: center; }
  .stat .num { font-size: 66px; font-weight: 900; color: #1c1917; line-height: 1; }
  .stat .num em { font-style: normal; font-size: 34px; }
  .stat .cap { margin-top: 10px; font-size: 24px; color: #57534e; font-weight: 600; }
  .right { flex: 1; background: #fff; border: 5px solid #1c1917; border-radius: 24px; padding: 48px 52px; }
  .tag { display: inline-block; background: #fde047; color: #1c1917; font-size: 28px; font-weight: 800; border-radius: 999px; padding: 8px 24px; }
  .line { margin-top: 26px; font-size: 46px; font-weight: 700; color: #1c1917; line-height: 1.45; }
  .line b { color: #d97706; font-size: 84px; font-weight: 900; }
  .brow { margin-top: 30px; }
  .blab { display: flex; justify-content: space-between; font-size: 26px; font-weight: 700; color: #57534e; }
  .btrack { margin-top: 10px; height: 24px; border-radius: 12px; background: #eee8dc; overflow: hidden; }
  .bfill { height: 100%; border-radius: 12px; }
  .site { margin-top: 34px; text-align: center; font-size: 34px; font-weight: 900; color: #1c1917; }
  .site span { background: linear-gradient(transparent 50%, #fde047 50%); padding: 0 10px; }
</style>
</head>
<body>
  <div class="frame">
    <div class="left">
      <div class="brand"><span class="dot">●</span> OFFER2PR</div>
      <div class="kicker">加拿大职业行情:厨师篇</div>
      <h1>在加拿大当厨师,<br>工资<span class="hl">比你想的高</span></h1>
      <div class="nums">
        <div class="stat"><div class="num">1,945</div><div class="cap">全国在招厨师岗</div></div>
        <div class="stat"><div class="num">528<em>个</em></div><div class="cap">高出省中位 20%+</div></div>
      </div>
    </div>
    <div class="right">
      <span class="tag">今天刚发布</span>
      <div class="line">Calgary 中餐厨师<br>时薪 <b>$38</b></div>
      <div class="brow"><div class="blab"><span>阿省中位</span><span>$17.5/时</span></div><div class="btrack"><div class="bfill" style="width:46%;background:#a8a29e"></div></div></div>
      <div class="brow"><div class="blab"><span>这个岗</span><span>$38/时</span></div><div class="btrack"><div class="bfill" style="width:100%;background:linear-gradient(90deg,#d97706,#fbbf24)"></div></div></div>
      <div class="site"><span>offer2pr.com</span></div>
    </div>
  </div>
</body>
</html>
