<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* 「够得着的岗」动效视频引擎:window.seek(ms) 逐帧驱动(无 CSS transition,全 JS 插值)
     9:16 1080×1920;品牌族:米色底/黑框/黄荧光。逐帧截图 30fps 合成,不是幻灯片。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f7f1e3; }
  .stage { position: absolute; inset: 40px; border: 6px solid #1c1917; border-radius: 26px; background: #faf6ea; overflow: hidden; }
  .layer { position: absolute; left: 0; right: 0; opacity: 0; }
  .brand { top: 64px; left: 64px; right: auto; font-size: 34px; font-weight: 800; letter-spacing: 3px; color: #1c1917; }
  .brand .dot { color: #f59e0b; }
  .kicker { top: 150px; left: 64px; font-size: 38px; font-weight: 600; color: #57534e; }

  /* S1 标题 */
  .h1a { top: 560px; text-align: center; font-size: 104px; font-weight: 900; color: #1c1917; letter-spacing: 3px; }
  .h1b { top: 720px; text-align: center; font-size: 104px; font-weight: 900; color: #1c1917; letter-spacing: 3px; }
  .h1b .wrap { position: relative; display: inline-block; padding: 0 14px; }
  .h1b .sweep { position: absolute; left: 0; bottom: 8px; height: 52%; width: 0%; background: #fde047; z-index: -1; }

  /* S2 数据卡 */
  .stat { left: 120px; right: 120px; background: #fff; border: 5px solid #1c1917; border-radius: 24px; text-align: center; padding: 56px 30px 48px; }
  .st1 { top: 430px; }
  .st2 { top: 950px; }
  .stat .num { font-size: 170px; font-weight: 900; color: #1c1917; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .num em { font-style: normal; font-size: 70px; }
  .stat .cap { margin-top: 22px; font-size: 42px; color: #57534e; font-weight: 600; }

  /* S3 实例卡(白底黑框,与数据卡同族——Frank「不要用黑的背景框」) */
  .case { top: 380px; left: 90px; right: 90px; background: #fff; border: 5px solid #1c1917; border-radius: 28px; padding: 64px 60px; }
  .tag { display: inline-block; background: #fde047; color: #1c1917; font-size: 36px; font-weight: 800; border-radius: 999px; padding: 10px 30px; transform-origin: left center; }
  .cline { margin-top: 40px; font-size: 62px; font-weight: 700; color: #1c1917; line-height: 1.4; }
  .cbig { display: inline-block; color: #d97706; font-size: 120px; font-weight: 900; transform-origin: left bottom; }
  .bars { margin-top: 56px; }
  .brow { margin-top: 34px; }
  .blab { display: flex; justify-content: space-between; font-size: 34px; font-weight: 700; color: #57534e; }
  .btrack { margin-top: 12px; height: 30px; border-radius: 15px; background: #eee8dc; overflow: hidden; }
  .bfill { height: 100%; border-radius: 15px; width: 0%; }
  .bmed .bfill { background: #a8a29e; }
  .bthis .bfill { background: linear-gradient(90deg, #d97706, #fbbf24); }
  .badge { position: absolute; right: 56px; bottom: 46px; background: #fde047; color: #1c1917; font-size: 44px; font-weight: 900; border-radius: 999px; padding: 12px 34px; transform-origin: center; }

  /* S4 checks */
  .chk { left: 120px; right: 100px; font-size: 54px; font-weight: 800; color: #1c1917; }
  .c1 { top: 1430px; }
  .c2 { top: 1530px; }
  .chk .tick { color: #15803d; margin-right: 16px; }

  /* S5 CTA(白底黑框同族) */
  .cta { top: 700px; left: 90px; right: 90px; background: #fff; border: 5px solid #1c1917; border-radius: 30px; padding: 70px 50px; text-align: center; transform-origin: center; }
  .cta .l1 { font-size: 44px; font-weight: 600; color: #57534e; }
  .cta .l2 { margin-top: 26px; font-size: 88px; font-weight: 900; color: #1c1917; position: relative; display: inline-block; padding: 0 12px; }
  .cta .l2 .sweep2 { position: absolute; left: 0; bottom: 8px; height: 46%; width: 0%; background: #fde047; z-index: -1; }
  .foot { top: 1740px; text-align: center; font-size: 26px; color: #a8a29e; }
</style>
</head>
<body>
<div class="stage">
  <div class="layer brand" id="brand"><span class="dot">●</span> OFFER2PR</div>
  <div class="layer kicker" id="kicker">加拿大职业行情:厨师篇</div>

  <div class="layer h1a" id="h1a">在加拿大当厨师,</div>
  <div class="layer h1b" id="h1b"><span class="wrap"><span class="sweep" id="sweep"></span>工资比你想的高</span></div>

  <div class="layer stat st1" id="st1"><div class="num" id="n1">0</div><div class="cap">全国在招厨师岗(Job Bank 官方数据)</div></div>
  <div class="layer stat st2" id="st2"><div class="num"><span id="n2">0</span><em> 个</em></div><div class="cap">工资高出所在省中位 20% 以上</div></div>

  <div class="layer case" id="case">
    <span class="tag" id="tag">今天刚发布</span>
    <div class="cline" id="cl1">Calgary 中餐厨师</div>
    <div class="cline">时薪 <span class="cbig" id="cbig">$38</span></div>
    <div class="bars">
      <div class="brow bmed"><div class="blab"><span>阿省厨师中位</span><span>$17.5/时</span></div><div class="btrack"><div class="bfill" id="bmed"></div></div></div>
      <div class="brow bthis"><div class="blab"><span>这个岗</span><span>$38/时</span></div><div class="btrack"><div class="bfill" id="bthis"></div></div></div>
    </div>
    <div class="badge" id="badge">中位的 2.2 倍</div>
  </div>

  <div class="layer chk c1" id="c1"><span class="tick">✓</span>不要学历要手艺,TEER 3</div>
  <div class="layer chk c2" id="c2"><span class="tick">✓</span>多省省提名紧缺清单常客</div>

  <div class="layer cta" id="cta">
    <div class="l1">每日更新的全加拿大职位板,带移民价值视角</div>
    <div class="l2"><span class="sweep2" id="sweep2"></span>offer2pr.com</div>
  </div>
  <div class="layer foot" id="foot">数据来源:Job Bank 公开职位与官方工资统计;省提名为粗筛信号,不构成移民建议</div>
</div>
<script>
const $ = (id) => document.getElementById(id)
const clamp01 = (x) => Math.max(0, Math.min(1, x))
const eo = (x) => 1 - Math.pow(1 - x, 3)                 // easeOutCubic
const eb = (x) => { const c = 1.70158 + 1; return 1 + c * Math.pow(x - 1, 3) + (c - 1) * Math.pow(x - 1, 2) } // overshoot
// 区间进度
const P = (t, a, b) => clamp01((t - a) / (b - a))
// 出场+离场组合透明度
const inout = (t, a, b, c, d) => Math.min(eo(P(t, a, b)), 1 - P(t, c, d))

function seek(ms) {
  const t = ms / 1000
  const fadeUp = (el, a, b, c, d, dist = 60) => {
    const pin = eo(P(t, a, b)), pout = P(t, c, d)
    el.style.opacity = String(Math.min(pin, 1 - pout))
    el.style.transform = `translateY(${(1 - pin) * dist}px)`
  }
  // 开场零留白(Frank「上来不要显示白板」):品牌/标题从第 0 帧就在进场途中
  // 停留原则(Frank「中间内容停留长一些」):每屏信息出全后至少停 3-4 秒再切
  fadeUp($('brand'), 0.0, 0.35, 99, 100, 30)
  fadeUp($('kicker'), 0.1, 0.5, 99, 100, 30)
  // S1 标题(sweep 完 2.2,停到 4.5,离场 4.5-5.0)
  fadeUp($('h1a'), 0.2, 0.8, 4.5, 5.0)
  fadeUp($('h1b'), 0.45, 1.1, 4.5, 5.0)
  $('sweep').style.width = (eo(P(t, 1.3, 2.2)) * 100) + '%'
  // S2 数据卡(5.1 进,数字 8.6 滚完 → 停到 12.0,出 12.0-12.5)
  fadeUp($('st1'), 5.1, 5.7, 12.0, 12.5, 80)
  fadeUp($('st2'), 6.9, 7.5, 12.0, 12.5, 80)
  $('n1').textContent = Math.round(eo(P(t, 5.4, 6.9)) * 1945).toLocaleString('en-US')
  $('n2').textContent = String(Math.round(eo(P(t, 7.2, 8.6)) * 528))
  // S3 实例卡(12.6 进,徽标 17.6 出全 → 停到 21.5,出 21.5-22.0)
  fadeUp($('case'), 12.6, 13.3, 21.5, 22.0, 100)
  const tagP = eb(P(t, 13.4, 13.8))
  $('tag').style.transform = `scale(${tagP})`
  const bigP = eb(P(t, 14.0, 14.6))
  $('cbig').style.transform = `scale(${Math.max(0.001, bigP)})`
  $('bmed').style.width = (eo(P(t, 15.0, 15.8)) * 46) + '%'
  $('bthis').style.width = (eo(P(t, 16.0, 17.0)) * 100) + '%'
  $('badge').style.transform = `scale(${eb(P(t, 17.2, 17.6))})`
  $('badge').style.opacity = String(P(t, 17.2, 17.3) > 0 ? 1 : 0)
  // S4 checks(与 S3 同屏下方,随 S3 一起退)
  fadeUp($('c1'), 13.7, 14.3, 21.5, 22.0, 50)
  fadeUp($('c2'), 14.8, 15.4, 21.5, 22.0, 50)
  // S5 CTA(22.2 进,常驻到结尾)
  const ctaP = eb(P(t, 22.2, 23.0))
  $('cta').style.opacity = String(clamp01(P(t, 22.2, 22.7)))
  $('cta').style.transform = `scale(${0.85 + 0.15 * ctaP})`
  $('sweep2').style.width = (eo(P(t, 23.3, 24.2)) * 100) + '%'
  fadeUp($('foot'), 24.0, 24.7, 99, 100, 20)
}
window.seek = seek
seek(0)
</script>
</body>
</html>
