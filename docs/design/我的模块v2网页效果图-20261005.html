<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的模块 v2 网页</title>
<!-- 我的模块 v2 网页端效果图(2026-10-05,Frank「有点粗糙」「网页端呢」后重画)。
     用法:?lang=zh|en&s=apps|thread|favs|profile|plan;一屏一张 1440 宽。登录态、往来、简历、购买记录为占位。 -->
<style>
  :root { --primary:#2563eb; --primary-deep:#1e40af; --ok:#15803d; --warn:#b45309; --danger:#dc2626;
    --text:#111827; --text2:#6b7280; --text3:#9ca3af; --border:#e5e7eb; --hair:#f3f4f6; --hover:#eff6ff; --bg:#f9fafb; --card:#fff; }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; font-family:system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size:14px; line-height:1.6; color:#1f2937; width:1440px; }
  a { color:var(--primary); text-decoration:none; }
  svg.i { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  /* 顶栏(照线上) */
  .hd { height:48px; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 82px; }
  .logo { display:flex; align-items:center; gap:8px; font-weight:700; font-size:18px; color:var(--text); }
  .logo b { color:#e11d48; font-size:18px; }
  .tagline { font-size:13px; color:var(--text3); margin-left:8px; }
  .nav { margin-left:auto; display:flex; align-items:center; gap:16px; font-size:14px; color:#4b5563; }
  .nav span { display:flex; align-items:center; gap:4px; }
  .nav .on { color:var(--primary); font-weight:600; }
  .lang { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; margin-left:6px; }
  .lang span { padding:2px 10px; color:var(--text2); font-size:13px; }
  .lang .on { background:var(--primary); color:#fff; font-weight:400; }
  .ava { width:30px; height:30px; border-radius:50%; background:var(--primary); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:14px; flex:none; }

  .main { padding:18px 82px 40px; }
  /* banner(照职位板) */
  .banner { height:130px; border-radius:14px; position:relative; overflow:hidden; color:#fff;
    background: linear-gradient(90deg, rgba(30,58,138,.92) 0%, rgba(37,99,235,.62) 55%, rgba(30,64,175,.85) 100%), url('../../cms/public/img/banners/account-1.jpg') center 40%/cover; }
  .banner .t { position:absolute; left:22px; top:38px; font-size:22px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .banner .t svg { width:22px; height:22px; stroke:#fff; }
  .banner .cnt { position:absolute; left:22px; bottom:14px; font-size:13px; opacity:.95; }
  .banner .dots { position:absolute; right:16px; top:10px; display:flex; gap:5px; }
  .banner .dots i { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.5); }
  .banner .dots i:first-child { background:#fff; }

  /* 侧栏 + 内容 */
  .cols { display:grid; grid-template-columns:232px 1fr; gap:20px; margin-top:18px; align-items:start; }
  .side { background:#fff; border:1px solid var(--border); border-radius:12px; padding:8px; display:flex; flex-direction:column; }
  .side .it { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; font-size:14px; color:#374151; }
  .side .it svg { color:var(--text3); }
  .side .it .n { margin-left:auto; font-size:12px; color:var(--text3); }
  .side .it.on { background:var(--hover); color:var(--primary); font-weight:600; }
  .side .it.on svg, .side .it.on .n { color:var(--primary); }
  .side .pro { margin-left:auto; font-size:11px; font-weight:700; color:#92400e; background:#fef3c7; border-radius:999px; padding:0 7px; }
  .side .me { border-top:1px solid var(--hair); margin-top:8px; padding:12px 12px 6px; display:flex; gap:10px; align-items:center; }
  .side .me .nm { font-size:14px; font-weight:600; color:var(--text); line-height:1.3; }
  .side .me .em { font-size:12px; color:var(--text3); line-height:1.3; }

  .panel { background:#fff; border:1px solid var(--border); border-radius:12px; padding:18px 20px 20px; min-height:560px; position:relative; }
  .ph { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .ph h2 { margin:0; font-size:18px; color:var(--text); }
  .ph .sub { font-size:13px; color:var(--text3); }
  .ph .r { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .upd { font-size:12px; color:var(--text3); }

  /* 表(照职位板 JobsTable) */
  .tbl { border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-weight:600; color:#374151; padding:10px 10px; background:var(--bg); border-bottom:1px solid var(--border); white-space:nowrap; }
  th.sort { color:var(--primary); }
  th .ar { font-size:10px; color:var(--text3); margin-left:2px; }
  th.sort .ar { color:var(--primary); }
  td { padding:11px 10px; border-bottom:1px solid var(--hair); vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  td .z { display:block; font-size:12px; color:var(--text3); line-height:1.4; }
  td.lk { color:var(--primary); }
  td.dim { color:var(--text2); white-space:nowrap; }
  tr.hot td { background:#f6fbf7; }
  tr.hot td:first-child { box-shadow: inset 3px 0 0 var(--ok); }
  tr.off td { color:var(--text3); }
  tr.off td.lk { color:#93a5c9; }
  .last { font-size:13px; color:var(--text2); max-width:300px; }
  .last .who { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text3); }
  .last .tx { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .last.new .tx { color:var(--text); }
  .tag { display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:1px 9px; border-radius:999px; font-weight:600; white-space:nowrap; }
  .tag.ok { background:#dcfce7; color:var(--ok); }
  .tag.sent { background:#dbeafe; color:var(--primary-deep); }
  .tag.gray { background:var(--hair); color:var(--text2); border:1px solid var(--border); }
  .tag.amber { background:#fef3c7; color:#92400e; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:32px; padding:0 14px; border-radius:8px; font-size:14px; font-weight:600; border:1px solid var(--border); background:#fff; color:#374151; white-space:nowrap; }
  .btn.pri { background:var(--primary); border-color:var(--primary); color:#fff; }
  .btn.sm { height:28px; padding:0 10px; font-size:13px; font-weight:500; }
  .btn.lg { height:40px; padding:0 18px; font-size:15px; }
  .chk { width:18px; height:18px; border-radius:5px; border:1.5px solid #cbd5e1; background:#fff; display:inline-block; vertical-align:middle; }
  .chk.on { background:var(--primary); border-color:var(--primary); position:relative; }
  .chk.on::after { content:""; position:absolute; left:5px; top:1px; width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
  .pos { color:var(--ok); font-weight:600; }
  .neg { color:#c2410c; font-weight:600; }
  .pay { font-weight:600; color:var(--text); }

  /* 底栏 */
  .bar { position:sticky; bottom:0; margin-top:14px; display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid #bfdbfe; background:#f5f9ff; border-radius:10px; }
  .bar .sel { font-size:14px; color:var(--text); font-weight:600; }
  .bar .clr { font-size:13px; color:var(--text2); }
  .bar .r { margin-left:auto; display:flex; gap:10px; align-items:center; }

  /* 卡 */
  .card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
  .ch { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .ch h3 { margin:0; font-size:15px; color:var(--text); }
  .ch .r { margin-left:auto; display:flex; gap:8px; }
  .kv { display:grid; grid-template-columns:104px 1fr; row-gap:0; font-size:14px; }
  .kv > span { padding:9px 0; border-top:1px solid var(--hair); }
  .kv > span:nth-child(-n+2) { border-top:none; }
  .kv .k { color:var(--text2); }
  .kv .g { display:block; font-size:12px; color:var(--text3); line-height:1.3; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .stack { display:flex; flex-direction:column; gap:16px; }

  /* 文档缩略 */
  .doc { display:flex; gap:16px; }
  .a4 { width:150px; height:194px; flex:none; background:#fff; border:1px solid var(--border); border-radius:6px; box-shadow:0 2px 8px rgba(15,23,42,.08); padding:14px 12px; overflow:hidden; }
  .a4 .nm { font-size:9px; font-weight:700; text-align:center; color:var(--text); }
  .a4 .ct { font-size:5px; text-align:center; color:var(--text3); margin-bottom:6px; }
  .a4 .sh { font-size:5.5px; font-weight:700; color:var(--text); border-bottom:1px solid #e5e7eb; margin:5px 0 3px; }
  .a4 i { display:block; height:3px; background:#e5e7eb; border-radius:2px; margin:3px 0; }
  .a4.letter { font-size:6px; line-height:1.5; color:#374151; padding:16px 14px; }
  .a4 .sl { background:#ede9fe; color:#6d28d9; border-radius:2px; padding:0 1px; }
  .dmeta .fn { font-size:15px; color:var(--primary); font-weight:600; word-break:break-all; display:flex; align-items:center; gap:6px; }
  .dmeta .sm { font-size:13px; color:var(--text2); margin-top:4px; }
  .dmeta .acts { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .lt { font-size:13px; color:#374151; line-height:1.6; }
  .lt .sl { background:#ede9fe; color:#6d28d9; border-radius:4px; padding:0 4px; }

  /* 订阅 */
  .planbig { display:flex; align-items:center; gap:10px; font-size:26px; font-weight:800; color:var(--text); }
  .planbig .star { color:#f59e0b; }
  .prog { height:8px; border-radius:999px; background:var(--hair); overflow:hidden; margin:14px 0 6px; }
  .prog i { display:block; height:100%; width:72%; background:var(--primary); border-radius:999px; }
  .pk { border:1px solid var(--border); border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:14px; }
  .pk + .pk { margin-top:10px; }
  .pk .p { font-size:22px; font-weight:800; color:var(--text); min-width:96px; }
  .pk .d { font-size:14px; color:var(--text); font-weight:600; }
  .pk .s { font-size:12px; color:var(--text3); }
  .pk .btn { margin-left:auto; }
  .pk.best { border-color:#93c5fd; background:#f8fbff; }

  /* 弹框(照线上职位弹框白卡) */
  .shade { position:fixed; inset:0; background:rgba(17,24,39,.45); display:flex; justify-content:center; align-items:flex-start; padding-top:64px; }
  .modal { width:820px; background:#fff; border-radius:14px; box-shadow:0 24px 60px rgba(0,0,0,.28); padding:18px 22px 0; max-height:880px; display:flex; flex-direction:column; }
  .mh { display:flex; align-items:flex-start; gap:12px; }
  .mh h1 { margin:0; font-size:22px; color:var(--text); line-height:1.3; }
  .mh .z { font-size:13px; color:var(--text3); }
  .mh .co { font-size:14px; margin-top:4px; display:flex; gap:14px; }
  .mh .co span { color:var(--text2); }
  .xb { margin-left:auto; height:32px; padding:0 12px; border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; font-size:13px; color:#374151; }
  .stabs { display:flex; gap:22px; border-bottom:1px solid var(--border); margin-top:14px; }
  .stabs span { padding:9px 0; font-size:14px; color:var(--text2); border-bottom:2px solid transparent; display:flex; gap:6px; align-items:center; }
  .stabs span.on { color:var(--primary); border-color:var(--primary); font-weight:600; }
  .stabs .n { font-size:12px; background:var(--hair); color:var(--text2); border-radius:999px; padding:0 7px; font-weight:500; }
  .thread { padding:14px 0; display:flex; flex-direction:column; gap:12px; overflow:hidden; }
  .msg { border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .msg.in { border-color:#bbf7d0; background:#fbfefc; }
  .msg .top { display:flex; align-items:center; gap:10px; }
  .msg .who { font-weight:600; color:var(--text); font-size:14px; }
  .msg .addr { font-size:12px; color:var(--text3); }
  .msg .when { margin-left:auto; font-size:12px; color:var(--text3); }
  .msg .sbj { font-size:14px; color:var(--text); margin-top:6px; font-weight:500; }
  .msg .body { font-size:14px; color:#374151; margin-top:6px; white-space:pre-line; }
  .msg .att { display:flex; gap:8px; margin-top:10px; }
  .chipf { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:8px; padding:4px 10px; font-size:13px; color:#374151; background:#fff; }
  .chipf b { font-size:10px; color:var(--danger); }
  .av2 { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none; }
  .av2.me { background:var(--primary); color:#fff; }
  .av2.em { background:#dcfce7; color:var(--ok); }
  .mf { border-top:1px solid var(--border); padding:12px 0 16px; display:flex; align-items:center; gap:10px; }
  .mf .hint { font-size:13px; color:var(--text2); display:flex; align-items:center; gap:6px; }
  .mf .r { margin-left:auto; display:flex; gap:10px; }
  .muted { color:var(--text2); }

  /* 第二轮细节(对照 AIApply):公司首字母块、职位格两行、面板轻阴影 */
  .panel, .side, .card { box-shadow:0 1px 2px rgba(15,23,42,.04), 0 4px 16px rgba(15,23,42,.04); }
  .jobcell { display:flex; gap:12px; align-items:flex-start; }
  .logo2 { width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex:none; }
  .jobcell .tt { color:var(--primary); font-size:15px; line-height:1.35; }
  .jobcell .co { color:#374151; font-size:13px; margin-top:2px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .chip { font-size:12px; border-radius:999px; padding:1px 10px; border:1px solid var(--border); background:var(--bg); color:#374151; display:inline-flex; gap:4px; align-items:center; }
  .chip.teer { background:#f3f4f6; }
  .chip.prio { background:#fef9c3; border-color:#fde68a; color:#854d0e; }
  .chip.sal { background:#f0fdf4; border-color:#bbf7d0; color:var(--ok); font-weight:600; }
  td.nw { white-space:nowrap; }
</style>
