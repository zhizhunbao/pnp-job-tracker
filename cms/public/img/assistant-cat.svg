<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="fur" cx="38%" cy="26%" r="80%">
      <stop offset="0" stop-color="#ffc98a"/>
      <stop offset="0.55" stop-color="#f59e42"/>
      <stop offset="1" stop-color="#c96a16"/>
    </radialGradient>
    <radialGradient id="cream" cx="42%" cy="28%" r="78%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f3dcbd"/>
    </radialGradient>
    <linearGradient id="earIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc2cf"/>
      <stop offset="1" stop-color="#f58fa6"/>
    </linearGradient>
    <radialGradient id="eye" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#6ee7a8"/>
      <stop offset="1" stop-color="#15803d"/>
    </radialGradient>
    <radialGradient id="ground" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0f172a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <radialGradient id="bell" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#d99a0b"/>
    </radialGradient>
    <style>
      .bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 64px 110px; }
      .lid { animation: blink 4.6s linear infinite; transform-origin: 64px 50px; }
      .tail { animation: wag 2.6s ease-in-out infinite; transform-origin: 90px 104px; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
      @keyframes blink { 0%, 46%, 50%, 100% { transform: scaleY(0); } 48% { transform: scaleY(1); } }
      @keyframes wag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(9deg); } }
      @media (prefers-reduced-motion: reduce) { .bob, .lid, .tail { animation: none; } .lid { transform: scaleY(0); } }
    </style>
  </defs>

  <ellipse cx="64" cy="117" rx="38" ry="7" fill="url(#ground)"/>

  <g class="bob">
    <!-- 尾巴:从身后翘起来,尖上一截白 -->
    <g class="tail">
      <path d="M88 106c16 2 24-10 20-24-2-7-9-9-12-4" fill="none" stroke="url(#fur)" stroke-width="10" stroke-linecap="round"/>
      <path d="M97 79c2-3 6-2 8 1" fill="none" stroke="#fffaf0" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- 身体 -->
    <ellipse cx="64" cy="94" rx="27" ry="23" fill="url(#fur)"/>
    <ellipse cx="64" cy="98" rx="16" ry="15" fill="url(#cream)"/>

    <!-- 前爪 -->
    <ellipse cx="52" cy="113" rx="9" ry="5.5" fill="url(#cream)"/>
    <ellipse cx="76" cy="113" rx="9" ry="5.5" fill="url(#cream)"/>
    <path d="M49 114v2.4M52 114.6v2.4M55 114v2.4M73 114v2.4M76 114.6v2.4M79 114v2.4" stroke="#d9b98f" stroke-width="1" stroke-linecap="round"/>

    <!-- 项圈与铃铛 -->
    <path d="M42 76c8 6 36 6 44 0l1.5 6c-10 7-37 7-47 0z" fill="url(#collar)"/>
    <circle cx="64" cy="86" r="5" fill="url(#bell)"/>
    <path d="M60.6 87.4h6.8M64 87.4v3" stroke="#8a5a00" stroke-width="1.1" stroke-linecap="round"/>

    <!-- 耳朵 -->
    <path d="M31 40L33 10 56 26z" fill="url(#fur)"/>
    <path d="M97 40L95 10 72 26z" fill="url(#fur)"/>
    <path d="M37 33L38 18 49 27z" fill="url(#earIn)"/>
    <path d="M91 33L90 18 79 27z" fill="url(#earIn)"/>

    <!-- 头 -->
    <ellipse cx="64" cy="50" rx="34" ry="29" fill="url(#fur)"/>
    <ellipse cx="50" cy="31" rx="13" ry="6.5" fill="#ffffff" fill-opacity="0.2" transform="rotate(-20 50 31)"/>

    <!-- 额头三道纹 -->
    <path d="M58 24v8M64 22v10M70 24v8" stroke="#b85e12" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.75"/>

    <!-- 脸颊红晕 -->
    <ellipse cx="38" cy="60" rx="6" ry="3.6" fill="#fb7185" fill-opacity="0.4"/>
    <ellipse cx="90" cy="60" rx="6" ry="3.6" fill="#fb7185" fill-opacity="0.4"/>

    <!-- 口鼻 -->
    <ellipse cx="64" cy="63" rx="15" ry="11" fill="url(#cream)"/>
    <path d="M60.4 57.4h7.2l-3.6 4.4z" fill="#f472b6"/>
    <path d="M64 61.8v3M64 64.8c-2.4 3.4-6.6 3.2-8 0.4M64 64.8c2.4 3.4 6.6 3.2 8 0.4" stroke="#8a4a1c" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- 胡须 -->
    <path d="M47 62H28M47 66l-18 4M81 62h19M81 66l18 4" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.9"/>

    <!-- 眼睛 -->
    <ellipse cx="49" cy="47" rx="6.4" ry="7.2" fill="url(#eye)"/>
    <ellipse cx="79" cy="47" rx="6.4" ry="7.2" fill="url(#eye)"/>
    <ellipse cx="49" cy="47.4" rx="2.6" ry="5.8" fill="#10210f"/>
    <ellipse cx="79" cy="47.4" rx="2.6" ry="5.8" fill="#10210f"/>
    <circle cx="51.2" cy="44" r="2" fill="#ffffff"/>
    <circle cx="81.2" cy="44" r="2" fill="#ffffff"/>
    <circle cx="47.4" cy="50.4" r="0.9" fill="#ffffff" fill-opacity="0.75"/>
    <circle cx="77.4" cy="50.4" r="0.9" fill="#ffffff" fill-opacity="0.75"/>

    <!-- 眨眼的眼皮 -->
    <g class="lid">
      <ellipse cx="49" cy="47" rx="7" ry="7.8" fill="#f59e42"/>
      <ellipse cx="79" cy="47" rx="7" ry="7.8" fill="#f59e42"/>
    </g>
  </g>
</svg>
